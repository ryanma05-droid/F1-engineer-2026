# Race engineer configuration. Paths are relative to the project folder.

listen:
  host: 0.0.0.0     # 0.0.0.0 = accept packets from any network interface
  port: 20777       # must match the port set in F1 25 telemetry settings

# Optional: resend every packet unchanged so other apps (e.g. SimHub) keep working.
# Give each app its own port and point that app at it.
forward: []
#  - host: 127.0.0.1
#    port: 20778

data_dir: data      # sessions/, tracks/, features/, models/ live under here

record: true        # save every raw packet to data/sessions/

radio:
  enabled: true         # speak calls (python -m engineer run --no-voice turns it off for one run)
  verbosity: normal     # terse | normal | chatty
  voice: en_GB-northern_english_male-medium   # Piper voice in data/voices/
  radio_effect: true    # squelch beeps + band-limited "team radio" sound
  volume: 1.0
  output_device: null   # null = Windows default output. Or part of a device name, e.g. "Headphones"
                        # (list them: python -m engineer.radio.setup_voice --devices)
  lap_delta_max_wait_s: 3.0   # wait up to this long for a straight, then drop the call
  cooldowns_s:                # minimum gap between two calls of the same kind
    lap_delta: 5.0
    tyre_status: 30.0
    tyre_warning: 10.0
    tyre_temp: 10.0
    tyre_dropoff: 60.0
    corner: 30.0
    strategy_plan: 20.0
    undercut: 30.0
    racecraft_defend: 30.0
    racecraft_attack: 60.0

tyres:                  # tyre coaching (Phase 3)
  enabled: true
  limit_pct: 60         # "laps left" = laps until the worst tyre reaches this wear
  laps_left_from_pct: 25   # only start saying "laps left" once a tyre is this worn
  status_every_laps: 3  # tyre status call every N laps of a stint
  wear_warnings_pct: [40, 50, 60]   # a call when the worst tyre passes each of these
  temp_calls: true      # "rears running hot in sector three"
  temp_window_c: [80, 110]   # carcass (inner) temperature window for slicks, Celsius
  temp_min_fraction: 0.6     # hot/cold = outside the window for this share of a sector
  dropoff_ms_per_lap: 150    # "pace dropping" when fuel-corrected pace fades faster than this
  fuel_s_per_kg: 0.03        # lap time cost of each kg of fuel (for the fuel correction)
  max_wait_s: 20             # tyre calls wait up to this long for a straight

corners:                # corner coaching (Phase 4)
  enabled: true
  min_loss_s: 0.1       # only call a corner where you lost at least this much
  nearby_gap_s: 2.0     # compare with the car ahead/behind if within this gap, else your best lap
  focus_after_laps: 2   # a corner losing time this many laps in a row is called first, with priority
  ref_wear_window_pct: 8   # "your pace" = your fastest lap with tyre wear within this many %
  back_off_after: 3     # after this many calls in a row on a corner: every other lap, unless worse
  battle_gap_s: 1.0     # a car this close ahead or behind: no corner coaching (you're busy)
  max_wait_s: 25        # wait up to this long for a straight

racecraft:              # the human side: battles, passes, start/finish, penalties (races only)
  enabled: true
  start: true           # "Great start, up eight places."
  passes: true          # "Great move on Norris, P three." / "Lost P three to Leclerc."
  battles: true         # defending / "catching three tenths a lap" / "DRS range on Norris"
  countdown: true       # five laps to go, last lap
  finish: true          # "Chequered flag, P three. Up six from the grid, great drive."
  fastest_lap: true     # when you take fastest lap from someone else
  penalties: true       # "Warning for track limits." / "Five second time penalty, ..."
  safety_car: true      # "Safety car in this lap, get the tyres ready."
  damage: true          # wing/floor damage after contact
  pass_hold_s: 4        # a pass is only called once it has stuck this long
  defend_gap_s: 1.0     # car behind inside this and closing: "Defend."
  clear_gap_s: 2.0      # ... until it drops back past this: "Good defending."
  attack_gap_s: 4.0     # car ahead within this, and
  min_closing_s: 0.15   # you're closing this much a lap, and you'd catch it before the flag

strategy:               # pit strategy (Phase 5): the plan, box calls, safety car stops
  enabled: true
  min_race_laps: 8      # no strategy calls in shorter races
  announce_after_lap: 2 # first plan after this lap (once your wear rate is measured)
  max_stops: 3
  window_s: 1.0         # pit window: stop laps within this many seconds of the best plan
  replan_laps: 2        # "plan change" when the stop moves this many laps (confirmed on 2 laps)
  min_gain_s: 3.0       # an extra stop must save at least this much to become the plan
  over_limit_s_per_pct: 1.0   # each lap past tyres.limit_pct costs this per % over
  # Everything about the tyres is learned from your laps and the game's own figures. These are
  # only used until there's data:
  pit_loss_s: 22        # until a pit stop at the track has been measured
  sc_pit_loss_factor: 0.5     # safety car stop = this share of the green one, until measured
  fallback_deg_s_per_pct: 0.05   # time per % of wear when there's no data and no game figure
  ai_weight: 0.5        # the AI field counts as half a driver's worth of laps for wear rates
  game_prior_laps: 5    # the game's tyre life figures count as 5 laps of yours
  game_deg_sd: 0.02     # how far off the game's time-per-% figure may be (s per %)
  two_compound_rule: auto     # auto: races of two_compound_min_laps or more; or on / off
  two_compound_min_laps: 10
  assume_sets_per_compound: 2 # if the game sends no tyre sets
  undercut_reminder: true     # "Norris behind has pitted, watch the undercut."
  undercut_gap_s: 3.0
  rejoin_traffic_s: 1.5 # "you'll come out behind X" when within this
  max_wait_s: 20

voice:                  # push-to-talk questions (Phase 6)
  enabled: true
  button: LB            # Xbox controller button you hold to talk (LB, RB, A, B, X, Y, ...)
  controller: null      # null = any connected controller
  model: base.en        # speech model: base.en (fastest), small.en (~3 s in a race), medium.en
  device: cpu           # cpu: the game keeps the GPU busy in a race (a question once waited
                        # 41 s for it). auto = the Nvidia GPU if it works (fine with no game on)
  cpu_threads: 4        # CPU threads for speech; the rest stay free for the game
  compute_type: auto
  beam_size: 1          # 1 = fastest, 5 = most careful
  max_answer_delay_s: 10   # an answer that would come later than this isn't said
  input_device: null    # null = the Windows default recording device (same as the game)
                        # (list them: python -m engineer.voice.setup --mics)
  min_press_s: 0.25     # shorter taps are ignored
  max_question_s: 10
  keep_audio: true      # keep each question's audio in data/ptt/clips/
  log: true             # log every question to data/ptt/questions.jsonl

# Upload recordings to GitHub automatically when you stop `engineer run` (Ctrl+C).
# Turn it on in config.local.yaml (your PC only, not shared):  upload: {auto: true}
upload:
  auto: false
  remote: origin
  min_mb: 2             # skip tiny recordings (menus, a few seconds)

# Driver report: your strengths and weaknesses from every recorded session, as a PDF in
# data/reports/. Build one any time: python -m engineer.report
report:
  daily: true           # when `engineer run` stops, build a new one if there are new sessions (once a day)
  open_when_ready: true # open the PDF when the daily report is done
