[project]
name = "race-engineer"
version = "0.1.0"
description = "Personal AI race engineer for EA SPORTS F1 25"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "zstandard>=0.22",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
