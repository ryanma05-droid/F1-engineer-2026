[project]
name = "race-engineer"
version = "0.1.0"
description = "Personal AI race engineer for EA SPORTS F1 25"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "faster-whisper>=1.0",
    "numpy>=1.26",
    "piper-tts>=1.8.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.6",
    "pyttsx3>=2.99 ; sys_platform == 'win32'",
    "pyyaml>=6.0",
    "sounddevice>=0.5.6",
    "zstandard>=0.22",
]

[dependency-groups]
build = [
    "pyinstaller>=6.10",
]
dev = ["pytest>=8.0"]
# Nvidia's CUDA libraries for speech recognition on an Nvidia GPU (Windows). Installed by a plain
# `uv sync` (default group below); without them speech recognition runs on the CPU.
gpu = [
    "nvidia-cublas-cu12>=12.4 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
]

[tool.uv]
default-groups = ["dev", "gpu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engineer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
