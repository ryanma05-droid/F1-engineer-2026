# Builds the installers: Windows (RaceEngineer-Setup-<version>.exe) and Mac
# (RaceEngineer-<version>-mac.dmg, Apple Silicon).
# - Push a tag like v0.1.0: builds both and publishes them on the repository's Releases page
#   (the download link to share).
# - Actions tab > "Build installers" > Run workflow: with no version, builds them as downloadable
#   artifacts only (for testing); with a version (e.g. 0.1.0), also creates the tag v0.1.0 and
#   publishes the release.
name: Build installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish, e.g. 0.1.0 (leave empty for a test build)"
        required: false
        default: ""

env:
  # The version being released, from a pushed tag or the manual-run input; empty = test build.
  RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group build

      - name: Run tests
        run: uv run pytest -q

      - name: Bundle the app (PyInstaller)
        run: uv run --group build pyinstaller packaging/race_engineer.spec --noconfirm

      - name: Smoke test the bundle
        run: dist\RaceEngineer\RaceEngineer.exe --check

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = if ($env:RELEASE_VERSION) { $env:RELEASE_VERSION.TrimStart("v") } else { "0.0.0-dev" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.value }}" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: RaceEngineer-Setup-windows
          path: dist/RaceEngineer-Setup-*.exe


  mac:
    runs-on: macos-latest          # Apple Silicon (M1 or newer Macs)
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group build

      - name: Run tests
        run: uv run pytest -q

      - name: Bundle the app (PyInstaller)
        run: uv run --group build pyinstaller packaging/race_engineer.spec --noconfirm

      - name: Smoke test the bundle
        run: dist/RaceEngineer/RaceEngineer --check

      - name: Build the .app and .dmg
        id: version
        run: |
          if [ -n "$RELEASE_VERSION" ]; then v="${RELEASE_VERSION#v}"; else v="0.0.0-dev"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          packaging/macos/build_dmg.sh "$v"

      - uses: actions/upload-artifact@v4
        with:
          name: RaceEngineer-mac
          path: dist/RaceEngineer-*-mac.dmg

  publish:
    # Only after BOTH builds passed, and only for a release (tag or a version given).
    needs: [windows, mac]
    if: github.ref_type == 'tag' || inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version
        id: version
        run: |
          v="${RELEASE_VERSION#v}"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          ls -la dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          target_commitish: ${{ github.sha }}
          name: Race Engineer ${{ steps.version.outputs.value }}
          files: |
            dist/RaceEngineer-Setup-*.exe
            dist/RaceEngineer-*-mac.dmg
          body_path: docs/release-notes.md
          fail_on_unmatched_files: true
